name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同分支新 push 取消旧的在跑的 CI(省额度)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 禁词门禁(PR 全量改动 vs main;维护者本机 push 已由 pre-commit/commit-msg
  # hook 查过——见 README「开发:提交门禁」。本地敏感词清单不入库,CI 只查公开清单)。
  word-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base
        run: git fetch origin main

      - name: Banned words
        run: python3 scripts/word_gate.py gate-diff origin/main

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = requires-python 下限;3.12 = release.yml 打二进制用的版本。
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # requirements.lock 锁全量依赖(编译自 pyproject,含 dev extra)——依赖不再
      # 每次 run 重解析,上游 breaking 不再炸 CI;栈保持 pip/setuptools
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Test
        run: pytest -q
