[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "2.6.0"
description = "Automated evaluation tool for Claude Code Skills"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9,<0.29",
    "rich>=13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock",
    "pytest-cov",
]

[project.scripts]
sift = "sift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: 真进程/真网络 opt-in 用例(真 CLI + auth + LLM 调用)——默认排除,SIFT_RUN_E2E=1 或 -m e2e 单独跑",
]
